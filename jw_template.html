<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James Wynne English — Exercises &amp; Feedback</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Dedicated Print Stylesheet */
        @media print {
            @page {
                margin: 1.5cm;
                size: A4;
            }

            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                font-size: 11pt;
                line-height: 1.5;
            }

            /* Hide interactive buttons and non-printable UI */
            .no-print {
                display: none !important;
            }

            /* Remove shadows and background tints for crisp printing */
            .print-clean {
                box-shadow: none !important;
                background-color: #ffffff !important;
                border-color: #d1d5db !important;
            }

            /* Make inputs and textareas look like clean fillable/filled lines */
            input[type="text"],
            input[type="email"],
            textarea {
                border: none !important;
                border-bottom: 1px solid #9ca3af !important;
                border-radius: 0 !important;
                background-color: transparent !important;
                padding-left: 0 !important;
                padding-right: 0 !important;
                box-shadow: none !important;
                color: #000000 !important;
            }

            textarea {
                border: 1px solid #d1d5db !important;
                border-radius: 4px !important;
                padding: 6px !important;
            }

            /* Prevent cards from splitting awkwardly across pages */
            .print-avoid-break {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            a {
                text-decoration: none !important;
                color: #000000 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- =================================================================== -->
    <!-- HEADER SECTION                                                      -->
    <!-- =================================================================== -->
    <header class="bg-white border-b border-slate-200 print-clean">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex flex-col sm:flex-row items-center justify-between gap-4">
            <!-- Teacher Logo -->
            <div class="flex items-center justify-center">
                <img 
                    src="https://static.wixstatic.com/media/6ce7a7_e9543ef199f041e19b45784dc836abeb~mv2.png" 
                    alt="James Wynne English Logo" 
                    class="h-14 sm:h-16 w-auto object-contain"
                    onerror="this.onerror=null; this.src='https://placehold.co/220x64/f8fafc/1e293b?text=James+Wynne+English';"
                >
            </div>
            <!-- Optional Subtitle / Document Type -->
            <div class="text-center sm:text-right">
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">English Language Learning</p>
                <p class="text-sm font-medium text-slate-600">Exercises, Feedback &amp; Advice</p>
            </div>
        </div>
    </header>

    <!-- =================================================================== -->
    <!-- STUDENT INFO & PRINT CONTROLS BAR                                   -->
    <!-- =================================================================== -->
    <section class="max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6 print-clean">
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-4 items-end">
                <!-- Student Name -->
                <div class="sm:col-span-5">
                    <label for="student-name" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                        Student Name
                    </label>
                    <input 
                        type="text" 
                        id="student-name" 
                        name="student-name" 
                        placeholder="Enter your full name"
                        class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                    >
                </div>

                <!-- Student Email -->
                <div class="sm:col-span-5">
                    <label for="student-email" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                        Student Email
                    </label>
                    <input 
                        type="email" 
                        id="student-email" 
                        name="student-email" 
                        placeholder="Enter your email address"
                        class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                    >
                </div>

                <!-- Print Button (Hidden when printing) -->
                <div class="sm:col-span-2 no-print">
                    <button 
                        type="button" 
                        onclick="window.print()" 
                        class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-white text-sm font-medium rounded-lg shadow-sm transition-colors cursor-pointer"
                        aria-label="Print this page"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                        </svg>
                        <span>Print</span>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- =================================================================== -->
    <!-- MAIN CONTENT CONTAINER                                              -->
    <!-- Add future exercises, tests, feedback, or advice inside <main>      -->
    <!-- =================================================================== -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- =============================================================== -->
        <!-- SAMPLE CONTENT BLOCK (Replace or duplicate for future lessons)  -->
        <!-- =============================================================== -->
        <article class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 sm:p-8 print-clean print-avoid-break">
            <div class="border-b border-slate-100 pb-4 mb-5">
                <span class="inline-block px-2.5 py-1 text-xs font-semibold bg-blue-50 text-blue-700 rounded-md mb-2">
                    Welcome!
                </span>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900">
                    Introduction - Before you start
                </h1>
                <p class="text-sm text-slate-500 mt-1">
                    Instructions: Complete the questions below. When finished, click the <strong>Print</strong> button above to save as PDF or print your work.
                </p>
            </div>

            <!-- Sample Question 1 -->
            <div class="space-y-4">
                <div>
                    <label for="sample-q1" class="block text-sm font
